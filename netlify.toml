[build]
  publish = "."
  # Oculta el badge flotante "Powered by Netlify" que trae el plan Free.
  # Refuerzo del ajuste del panel (Site configuration → Post processing →
  # Netlify badge). Si el panel ya lo tiene apagado, esto no molesta.
  [build.environment]
    NETLIFY_BADGE = "false"

# Avisa a IndexNow (Bing/Yandex) en cada deploy de producción.
# Plugin local, sin dependencias externas.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El og-image casi nunca cambia: cache largo + immutable.
[[headers]]
  for = "/og-web.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Mapa del sitio para asistentes de IA (ChatGPT, Perplexity, Claude…).
# text/plain explícito: algunos lectores rechazan el charset por defecto.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# El sitemap cambia con cada guía nueva: cache corto.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Las rutas limpias (/guias, /como-instalar-cachyos, etc.) las resuelve
# automáticamente Netlify con pretty URLs: 301 -> /ruta/ -> index.html.
# No hacen falta redirects manuales.

# ---------------------------------------------------------------------------
# DOMINIO PROPIO — juanpabloia.cl
#
# 301 ACTIVO desde 2026-11-11: juanpabloia.cl ya resuelve y tiene certificado
# Let's Encrypt propio. Redirige el subdominio viejo .netlify.app al dominio
# nuevo conservando la ruta. (Netlify también redirige el dominio primario
# solo; esto es refuerzo explícito.)
[[redirects]]
  from = "https://juanpablomasia.netlify.app/*"
  to = "https://juanpabloia.cl/:splat"
  status = 301
  force = true
