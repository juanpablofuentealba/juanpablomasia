[build]
  publish = "."

# Avisa a IndexNow (Bing/Yandex) en cada deploy de producción.
# Plugin local, sin dependencias externas.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El og-image casi nunca cambia: cache largo + immutable.
[[headers]]
  for = "/og-web.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Mapa del sitio para asistentes de IA (ChatGPT, Perplexity, Claude…).
# text/plain explícito: algunos lectores rechazan el charset por defecto.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# El sitemap cambia con cada guía nueva: cache corto.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Las rutas limpias (/guias, /como-instalar-cachyos, etc.) las resuelve
# automáticamente Netlify con pretty URLs: 301 -> /ruta/ -> index.html.
# No hacen falta redirects manuales.

# ---------------------------------------------------------------------------
# DOMINIO PROPIO — juanpabloia.cl
#
# ⚠️ 301 DESACTIVADO A PROPÓSITO (2026-11-10).
# El dominio ya está comprado, pero AÚN NO está conectado en Netlify: el DNS de
# juanpabloia.cl todavía NO resuelve. Si este 301 estuviera activo, el
# .netlify.app redirigiría a un dominio muerto y el sitio quedaría
# INACCESIBLE para todo el mundo.
#
# Orden correcto:
#   1. Conectar juanpabloia.cl en Netlify (Domain settings) y esperar el DNS.
#   2. Cuando https://juanpabloia.cl/ responda, DESCOMENTAR este bloque y
#      pushear (o correr ./bin/cambiar-dominio.sh juanpabloia.cl, que ya deja
#      el código apuntando al dominio).
# Netlify ya redirige el .netlify.app al dominio primario automáticamente
# cuando el dominio está conectado, así que este 301 es solo refuerzo.
#
# [[redirects]]
#   from = "https://juanpablomasia.netlify.app/*"
#   to = "https://juanpabloia.cl/:splat"
#   status = 301
#   force = true
